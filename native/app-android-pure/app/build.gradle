plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.warzone.kotlin'
    compileSdk 34
    defaultConfig {
        applicationId 'com.warzone.kotlinpure'
        minSdk 26
        targetSdk 33
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1') + 100
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // مفتاح توقيع ثابت: كل بناء يُثبَّت فوق السابق كتحديث (بدل مفتاح عشوائي جديد كل مرة يمنع التحديث فتبقى النسخة القديمة)
    // توقيع تلقائي: إن وُجدت أسرار المفتاح (WZ_KEYSTORE_FILE...) يُوقَّع بمفتاح الإصدار الخاص بك، وإلا بالمفتاح الثابت الافتراضي
    signingConfigs {
        fixed { storeFile file('warzone-debug.keystore'); storePassword 'android'; keyAlias 'warzone'; keyPassword 'android' }
        if (System.getenv('WZ_KEYSTORE_FILE')) {
            release { storeFile file(System.getenv('WZ_KEYSTORE_FILE')); storePassword System.getenv('WZ_KEYSTORE_PASSWORD'); keyAlias System.getenv('WZ_KEY_ALIAS'); keyPassword System.getenv('WZ_KEY_PASSWORD') }
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            debuggable false
            minifyEnabled false
            signingConfig System.getenv('WZ_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.fixed
        }
    }
}
dependencies {
    implementation project(':core')
}
