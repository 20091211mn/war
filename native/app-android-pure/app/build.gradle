plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.warzone.kotlin'
    compileSdk 34
    defaultConfig {
        applicationId 'com.warzone.kotlinpure'
        minSdk 26
        targetSdk 33
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1') + 100
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // مفتاح توقيع ثابت: كل بناء يُثبَّت فوق السابق كتحديث (بدل مفتاح عشوائي جديد كل مرة يمنع التحديث فتبقى النسخة القديمة)
    signingConfigs { fixed { storeFile file('warzone-debug.keystore'); storePassword 'android'; keyAlias 'warzone'; keyPassword 'android' } }
    lint { checkReleaseBuilds false; abortOnError false }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }
}
dependencies {
    implementation project(':core')
}
