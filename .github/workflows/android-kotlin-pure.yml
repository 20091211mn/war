name: Build Android Kotlin PURE APK (no C++)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Smoke test Kotlin engine (menu, 8 maps, play, render)
        continue-on-error: true
        run: gradle -p native/kotlin :core:test --tests com.warzone.core.SmokeTest --no-daemon -i 2>&1 | grep -E "NET host|lanLoopback|PERF|VM wpn|VMNAN|SMOKE|FAILED|PASSED|Exception|AssertionError|at com.warzone" | head -40
      - name: Build Kotlin app (Kotlin only, no C++)
        run: gradle -p native/app-android-pure assembleRelease --no-daemon
      - name: Collect APK
        run: cp native/app-android-pure/app/build/outputs/apk/release/app-release.apk Warzone-kotlin-pure.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warzone-kotlin-pure-apk
          path: Warzone-kotlin-pure.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Warzone (APK)
          files: Warzone-kotlin-pure.apk
