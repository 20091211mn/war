name: Build iOS Swift IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test mobile layer (headless)
        run: cd native/mobile && clang++ -std=c++17 -O2 -o /tmp/mt mobiletest.cpp && /tmp/mt
      - name: Test LAN (C++ engine host<->client)
        run: cd native/src && clang++ -std=c++17 -O2 -o /tmp/nt nettest.cpp && /tmp/nt | tail -6
      - name: Import Apple signing certificate (if secrets present)
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ]; then
            KC="$RUNNER_TEMP/wz.keychain-db"; KP=$(uuidgen)
            security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 3600 "$KC"; security unlock-keychain -p "$KP" "$KC"
            echo "$P12" | base64 -D > "$RUNNER_TEMP/cert.p12"; security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
            security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null; security list-keychains -d user -s "$KC" login.keychain
            echo "$PROFILE" | base64 -D > "$RUNNER_TEMP/wz.mobileprovision"
            ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' 'NR==1{print $2}')
            echo "IOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"; echo "IOS_PROVISION_PROFILE=$RUNNER_TEMP/wz.mobileprovision" >> "$GITHUB_ENV"; echo "Apple certificate imported: $ID"
          else echo "No Apple secrets: ad-hoc signing"; fi
      - name: Build Swift app (signed automatically)
        run: bash native/app-ios/build.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warzone-swift-ipa
          path: native/app-ios/out/Warzone-swift.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Warzone (APK)
          files: native/app-ios/out/Warzone-swift.ipa
