name: Build Godot (experimental) iOS project
on:
  push:
    branches: [main]
    paths: ['godot/**', 'tools/make-lang.py', '.github/workflows/godot-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 + export templates
        run: |
          V=4.7.2-stable
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_macos.universal.zip
          curl -sL -o tpz.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          unzip -q godot.zip; unzip -q tpz.zip
          T="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$T"; cp -R templates/* "$T/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV
      - name: Export Xcode project
        run: |
          "$GODOT" --headless --path godot --import 2>&1 | tail -3 || true
          mkdir -p build-ios
          "$GODOT" --headless --path godot --export-debug "iOS" ../build-ios/Warzone.xcodeproj 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tail -20
          ls build-ios
      - name: Build app (arm64 device, unsigned) and package IPA
        run: |
          cd build-ios
          xcodebuild -project Warzone.xcodeproj -scheme Warzone -sdk iphoneos -configuration Debug -derivedDataPath "$PWD/dd" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -8
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" | head -1); echo "APP=$APP"; test -d "$APP"
          # توقيع ad-hoc (تعيد أدوات التثبيت الجانبي مثل AltStore/Sideloadly توقيعه بحسابك)
          codesign --force --deep --sign - "$APP" 2>&1 | tail -2 || true
          rm -rf Payload; mkdir Payload; cp -R "$APP" Payload/Warzone.app
          zip -qry ../Warzone-godot.ipa Payload   # نسخة 1: موقّعة ad-hoc
          # نسخة 2: بدون أي توقيع (لأدوات إعادة التوقيع / TrollStore)
          rm -rf Payload Unsigned; mkdir Unsigned Unsigned/Payload; cp -R "$APP" Unsigned/Payload/Warzone.app
          rm -rf Unsigned/Payload/Warzone.app/_CodeSignature Unsigned/Payload/Warzone.app/embedded.mobileprovision
          codesign --remove-signature Unsigned/Payload/Warzone.app 2>&1 | tail -1 || true
          (cd Unsigned && zip -qry ../../Warzone-godot-unsigned.ipa Payload)
          unzip -l ../Warzone-godot.ipa | tail -1; unzip -l ../Warzone-godot-unsigned.ipa | tail -1
      - name: Package Xcode project
        run: zip -qr warzone-godot-ios-xcodeproj.zip build-ios -x "build-ios/dd/*" "build-ios/Payload/*"
      - uses: actions/upload-artifact@v4
        with:
          name: warzone-godot-ios-ipa
          path: |
            Warzone-godot.ipa
            Warzone-godot-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: warzone-godot-ios-xcodeproj
          path: warzone-godot-ios-xcodeproj.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            Warzone-godot.ipa
            Warzone-godot-unsigned.ipa
