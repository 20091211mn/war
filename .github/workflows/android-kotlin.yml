name: Build Android Kotlin APK
on:
  push:
    branches: [main]
    paths:
      - 'native/kotlin/**'
      - 'tools/export-kotlin*'
      - '.github/workflows/android-kotlin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - name: Core unit tests (pure JVM)
        working-directory: native/kotlin
        run: gradle :core:test --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: kotlin-core-test-reports, path: native/kotlin/core/build/reports/tests }
