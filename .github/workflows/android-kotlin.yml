name: Build Android Kotlin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Smoke test Kotlin engine (menu, 8 maps, play, render)
        continue-on-error: true
        run: gradle -p native/kotlin :core:test --tests com.warzone.core.SmokeTest --no-daemon -i 2>&1 | grep -E "SMOKE|FAILED|PASSED|Exception|AssertionError|at com.warzone" | head -40
      - name: Build Kotlin app (Kotlin only, no C++)
        run: gradle -p native/app-android assembleDebug --no-daemon
      - name: Collect APK
        run: cp native/app-android/app/build/outputs/apk/debug/app-debug.apk Warzone-kotlin.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warzone-kotlin-apk
          path: Warzone-kotlin.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Warzone (APK)
          files: Warzone-kotlin.apk
