name: Build Android Kotlin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Test mobile layer (headless)
        run: cd native/mobile && g++ -std=c++17 -O2 -pthread -o /tmp/mt mobiletest.cpp && /tmp/mt
      - name: Build engine library (NDK)
        run: bash native/app-android/build-native.sh
      - name: Build Kotlin app
        run: gradle -p native/app-android assembleDebug --no-daemon
      - name: Collect APK
        run: cp native/app-android/app/build/outputs/apk/debug/app-debug.apk Warzone-kotlin.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warzone-kotlin-apk
          path: Warzone-kotlin.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Warzone (APK)
          files: Warzone-kotlin.apk
