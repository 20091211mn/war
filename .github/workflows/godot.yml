name: Build Godot (experimental) APK
on:
  push:
    branches: [main]
    paths: ['godot/**', 'tools/export-godot.js', 'tools/make-lang.py', '.github/workflows/godot.yml']
  workflow_dispatch:
jobs:
  test-and-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VER: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Godot + export templates
        run: |
          curl -sL -o g.zip https://github.com/godotengine/godot/releases/download/$GODOT_VER/Godot_v${GODOT_VER}_linux.x86_64.zip
          curl -sL -o t.tpz https://github.com/godotengine/godot/releases/download/$GODOT_VER/Godot_v${GODOT_VER}_export_templates.tpz
          unzip -q g.zip; sudo mv Godot_v${GODOT_VER}_linux.x86_64 /usr/local/bin/godot; chmod +x /usr/local/bin/godot
          unzip -q t.tpz; mkdir -p ~/.local/share/godot/export_templates; mv templates ~/.local/share/godot/export_templates/${GODOT_VER/-/.}
          godot --version
      - name: Import project + self-test (headless)
        working-directory: godot
        run: |
          godot --headless --import 2>&1 | tail -5 || true
          godot --headless -- --selftest 2>&1 | grep -v "mesh_get_surface_count\|Parameter \"m\" is null" | tee /tmp/selftest.log | tail -15
          grep -q "SELFTEST ok" /tmp/selftest.log
          grep -q "OVERTEST ok" /tmp/selftest.log
          ! grep -q "SCRIPT ERROR" /tmp/selftest.log
      - name: Set up Android export
        run: |
          ls /usr/lib/android-sdk 2>/dev/null | head -3 || true
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          mkdir -p ~/.config/godot ~/.local/share/godot/export_templates
          [ -f $HOME/debug.keystore ] || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot --headless --editor --quit --path godot 2>&1 | tail -3 || true
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAVA="$JAVA_HOME"
          echo "java path: $JAVA"
          F=$(ls ~/.config/godot/editor_settings-4*.tres | head -1)
          echo "settings file: $F"
          cat >> "$F" <<EOF
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
          sed -i 's/^          //' "$F"
          tail -8 "$F"
      - name: Export Android APKs (debug-signed + release-signed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          mkdir -p build
          # 1) نسخة موقّعة بمفتاح debug
          godot --headless --path godot --export-debug "Android" ../build/Warzone-godot-debug.apk 2>&1 | grep -v "mesh_get_surface_count\|Parameter \"m\" is null" | tail -15
          # 2) نسخة release موقّعة بمفتاح الإصدار (سرّ المستودع إن وُجد، وإلا المفتاح الثابت tools/signing)
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > $HOME/release.jks; PASS="$KS_PASS"; else cp tools/signing/warzone-release.jks $HOME/release.jks; PASS=warzone2026; fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.jks GODOT_ANDROID_KEYSTORE_RELEASE_USER=warzone GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$PASS"
          godot --headless --path godot --export-release "Android" ../build/Warzone-godot-release.apk 2>&1 | grep -v "mesh_get_surface_count\|Parameter \"m\" is null" | tail -15
          ls -la build/
          test -s build/Warzone-godot-debug.apk; test -s build/Warzone-godot-release.apk
          APKSIGNER=$(ls ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/*/apksigner | tail -1)
          for f in debug release; do echo "== $f"; $APKSIGNER verify --print-certs build/Warzone-godot-$f.apk | grep -i "DN:\|SHA-256" | head -2; done
      - uses: actions/upload-artifact@v4
        with:
          name: warzone-godot-android
          path: build/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: build/*.apk
