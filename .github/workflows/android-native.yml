name: Build Android Native APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test mobile layer (headless)
        run: |
          cd native/mobile && g++ -std=c++17 -O2 -pthread -o /tmp/mt mobiletest.cpp && /tmp/mt
      - name: Build native APK (NDK, no Gradle, no HTML)
        run: bash native/mobile/android/build.sh
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warzone-native-apk
          path: native/mobile/android/out/Warzone-native.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Warzone (APK)
          files: native/mobile/android/out/Warzone-native.apk
