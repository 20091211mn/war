name: Cleanup old release assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for a in Warzone-kotlin.apk; do
            id=$(gh api repos/${{ github.repository }}/releases/tags/latest -q ".assets[]|select(.name==\"$a\")|.id")
            if [ -n "$id" ]; then gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id && echo "deleted $a"; fi
          done
