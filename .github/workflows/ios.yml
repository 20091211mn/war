name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm install
      - name: Build web assets
        run: node tools/build-www.js
      - name: Create iOS project
        run: |
          npx cap add ios
          node tools/patch-ios.js
          npx cap sync ios
      - name: Build unsigned app
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry Warzone-unsigned.ipa Payload)
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warzone-ipa
          path: out/Warzone-unsigned.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Warzone (APK)
          files: out/Warzone-unsigned.ipa
